<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">Tool-call failure map</title>
  <desc id="desc">A calm two by two map comparing expected success, loud failures, silent failures, and noisy or mixed traces by visible error level.</desc>
  <style>
    .bg { fill: #f8fafc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .rail { stroke: #e2e8f0; stroke-width: 2; }
    .title { fill: #0f172a; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 34px; font-weight: 750; }
    .subtitle { fill: #475569; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 19px; font-weight: 500; }
    .topLabel { fill: #334155; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 18px; font-weight: 700; }
    .cardTitle { fill: #0f172a; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 22px; font-weight: 750; }
    .cardBody { fill: #334155; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 20px; font-weight: 500; }
    .success { fill: #dcfce7; stroke: #16a34a; stroke-width: 2.5; }
    .loud { fill: #fee2e2; stroke: #dc2626; stroke-width: 2.5; }
    .silent { fill: #ffedd5; stroke: #ea580c; stroke-width: 2.5; }
    .mixed { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2.5; }
  </style>

  <rect class="bg" width="1000" height="600" rx="28" />

  <text class="title" x="500" y="64" text-anchor="middle">Tool-call failure map</text>
  <text class="subtitle" x="500" y="100" text-anchor="middle">The visible error is only one part of the benchmark.</text>

  <rect class="panel" x="70" y="135" width="860" height="410" rx="26" />
  <line class="rail" x1="500" y1="190" x2="500" y2="500" />
  <line class="rail" x1="110" y1="348" x2="890" y2="348" />

  <text class="topLabel" x="295" y="168" text-anchor="middle">Lower visible error</text>
  <text class="topLabel" x="705" y="168" text-anchor="middle">Higher visible error</text>

  <rect class="success" x="110" y="195" width="370" height="135" rx="20" />
  <text class="cardTitle" x="295" y="240" text-anchor="middle">Expected success</text>
  <text class="cardBody" x="295" y="270" text-anchor="middle">Clean result</text>
  <text class="cardBody" x="295" y="298" text-anchor="middle">Bounded output</text>

  <rect class="loud" x="520" y="195" width="370" height="135" rx="20" />
  <text class="cardTitle" x="705" y="240" text-anchor="middle">Loud failure</text>
  <text class="cardBody" x="705" y="270" text-anchor="middle">Exit / timeout / crash</text>
  <text class="cardBody" x="705" y="298" text-anchor="middle">Visible, still needs trace</text>

  <rect class="silent" x="110" y="365" width="370" height="135" rx="20" />
  <text class="cardTitle" x="295" y="410" text-anchor="middle">Silent failure</text>
  <text class="cardBody" x="295" y="440" text-anchor="middle">Success response</text>
  <text class="cardBody" x="295" y="468" text-anchor="middle">Wrong or unsafe result</text>

  <rect class="mixed" x="520" y="365" width="370" height="135" rx="20" />
  <text class="cardTitle" x="705" y="410" text-anchor="middle">Noisy or mixed</text>
  <text class="cardBody" x="705" y="440" text-anchor="middle">Retries / floods</text>
  <text class="cardBody" x="705" y="468" text-anchor="middle">Partial trace</text>
</svg>
