server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: toolguard-runs
    static_configs:
      - targets: [localhost]
        labels:
          job: toolguard-runs
          service_name: toolguard-local-demo
          __path__: /workspace/runs/**/otel-logs.ndjson
    pipeline_stages:
      - json:
          expressions:
            service_name: service_name
            event_type: event_type
            level: level
            run_id: run_id
            trace_id: trace_id
            tool_call_id: tool_call_id
            message: message
      - labels:
          service_name:
          event_type:
          level:
