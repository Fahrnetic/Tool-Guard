openapi: 3.1.0
info:
  title: ToolGuard Local Core API
  version: 0.0.0
  description: Local-first API for ToolGuard health, events, evidence, policies, replay, reports, bundles, visibility imports, and route diagnostics.
servers:
  - url: http://127.0.0.1:3660
paths:
  /health:
    get:
      summary: Lightweight Core API health check.
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"
  /metrics:
    get:
      summary: Prometheus-compatible local metrics.
      responses:
        "200":
          description: Text exposition format metrics.
          content:
            text/plain:
              schema:
                type: string
  /events:
    get:
      summary: Server-sent event stream for ToolGuard Core events.
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema:
                type: string
  /api/runs/latest:
    get:
      summary: Latest run metadata, Core events, and evidence paths.
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"
  /api/run-index:
    get:
      summary: Run index records from the local evidence store.
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"
  /api/runs:
    get:
      summary: Alias for the run index records.
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"
  /api/health:
    get:
      summary: Detailed ToolGuard run health payload.
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"
  /api/validation-dashboard:
    get:
      summary: Local validation dashboard payload for proof readiness.
      responses:
        "200":
          description: Validation dashboard checks and artifact coverage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationDashboardPayload"
              examples:
                proofReadiness:
                  $ref: "#/components/examples/ValidationDashboardSuccess"
  /api/topology/{runId}:
    get:
      summary: Run topology for a run ID or latest.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"
        "404":
          $ref: "#/components/responses/JsonError"
  /api/narrative/{runId}:
    get:
      summary: Run health narrative for a run ID or latest.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"
        "404":
          $ref: "#/components/responses/JsonError"
  /api/failures:
    get:
      summary: Failure inbox payload with redacted evidence links.
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"
  /api/impact:
    get:
      summary: Side-effect impact summary for the active run.
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"
  /api/triage:
    get:
      summary: Failure triage payload for the active run.
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"
  /api/triage/export:
    post:
      summary: Export a markdown issue packet for the active run.
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"
        "405":
          $ref: "#/components/responses/JsonError"
  /api/triage/issue-packet:
    get:
      summary: Serve the exported issue packet markdown.
      responses:
        "200":
          description: Markdown issue packet.
          content:
            text/markdown:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/JsonError"
  /api/traces/{traceId}:
    get:
      summary: Trace explorer payload for a trace ID or latest.
      parameters:
        - name: traceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"
  /api/policies:
    get:
      summary: Current policy decisions and preview payload.
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"
    put:
      summary: Preview policy settings for the current run.
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"
  /api/policy/simulate:
    post:
      summary: Simulate a recorded policy scenario.
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"
        "400":
          $ref: "#/components/responses/JsonError"
        "405":
          $ref: "#/components/responses/JsonError"
  /api/integrations:
    get:
      summary: Integration inventory, route coverage, setup metadata, and proof history.
      responses:
        "200":
          description: Integration route summary payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationsPayload"
              examples:
                proofInventory:
                  $ref: "#/components/examples/IntegrationsSuccess"
        "405":
          $ref: "#/components/responses/JsonError"
  /api/integrations/verify:
    post:
      summary: Verify a ToolGuard integration route and emit a route receipt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationVerificationRequest"
            examples:
              jsTsWrapper:
                $ref: "#/components/examples/IntegrationVerifyRequest"
      responses:
        "200":
          description: Route verification receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationVerificationReceipt"
              examples:
                jsTsWrapperReceipt:
                  $ref: "#/components/examples/IntegrationVerifySuccess"
        "400":
          description: Unknown or invalid route verification request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unknownRoute:
                  $ref: "#/components/examples/UnknownRouteError"
        "405":
          $ref: "#/components/responses/JsonError"
  /api/visibility/import/http:
    post:
      summary: Import bounded HTTP or webhook evidence without claiming mediation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            examples:
              webhookImport:
                $ref: "#/components/examples/HttpImportRequest"
      responses:
        "202":
          description: Imported and redacted HTTP or webhook evidence.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              examples:
                accepted:
                  $ref: "#/components/examples/HttpImportAccepted"
        "400":
          description: Malformed JSON or invalid HTTP import payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                malformedJson:
                  $ref: "#/components/examples/MalformedJsonError"
        "405":
          $ref: "#/components/responses/JsonError"
        "413":
          $ref: "#/components/responses/JsonError"
  /api/visibility/import/browser:
    post:
      summary: Import synthetic browser evidence summaries without launching a browser.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            examples:
              syntheticBrowserEvidence:
                $ref: "#/components/examples/BrowserImportRequest"
      responses:
        "202":
          description: Imported synthetic browser evidence summary.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              examples:
                accepted:
                  $ref: "#/components/examples/BrowserImportAccepted"
        "400":
          $ref: "#/components/responses/JsonError"
        "405":
          $ref: "#/components/responses/JsonError"
        "413":
          $ref: "#/components/responses/JsonError"
  /api/story:
    get:
      summary: Demo story mode payload.
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"
  /api/story/reset:
    post:
      summary: Reset a story mode scenario.
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"
        "404":
          $ref: "#/components/responses/JsonError"
  /api/replay:
    get:
      summary: Replay lab fixtures and safe replay categories.
      responses:
        "200":
          description: Replay lab state and safe replay options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayPayload"
              examples:
                replayState:
                  $ref: "#/components/examples/ReplaySuccess"
    post:
      summary: Request a safe replay, dry-run preview, or blocked replay decision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            examples:
              blockedDestructive:
                $ref: "#/components/examples/ReplayBlockedRequest"
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"
        "201":
          $ref: "#/components/responses/JsonObject"
        "409":
          description: Replay request blocked by safety policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                blockedDestructive:
                  $ref: "#/components/examples/ReplayBlocked"
  /api/evidence:
    get:
      summary: Evidence metadata for the active run.
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"
  /api/runs/{runId}/evidence:
    get:
      summary: Evidence metadata for the active run using a run-scoped alias.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"
  /api/reports/export:
    get:
      summary: Export a static report and validate its manifest.
      responses:
        "200":
          description: Report export locations and manifest validation status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportExportResponse"
              examples:
                exportedReport:
                  $ref: "#/components/examples/ReportExportSuccess"
  /api/bundle/export:
    post:
      summary: Export an evidence bundle with manifest validation and replay instructions.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            examples:
              fixtureOnly:
                $ref: "#/components/examples/BundleExportRequest"
      responses:
        "200":
          description: Bundle export locations and manifest validation status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleExportResponse"
              examples:
                exportedBundle:
                  $ref: "#/components/examples/BundleExportSuccess"
        "405":
          $ref: "#/components/responses/JsonError"
  /api/bundle:
    get:
      summary: Current evidence bundle summary for UI consumers.
      responses:
        "200":
          description: Current bundle summary for the active run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundlePayload"
              examples:
                currentBundle:
                  $ref: "#/components/examples/BundleSuccess"
  /api/bundles/{runId}/files/{relativePath}:
    get:
      summary: Serve a constrained evidence bundle file.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/RelativePath"
      responses:
        "200":
          description: Bundle file content.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/plain:
              schema:
                type: string
            text/html:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/JsonError"
        "404":
          $ref: "#/components/responses/JsonError"
  /api/reports:
    get:
      summary: Report summaries for the active run.
      responses:
        "200":
          description: Report summaries for the active run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportsPayload"
              examples:
                reports:
                  $ref: "#/components/examples/ReportsSuccess"
  /api/reports/{runId}/files/{fileName}:
    get:
      summary: Serve a constrained generated report file.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: fileName
          in: path
          required: true
          schema:
            type: string
            enum: [report.html, manifest.json, artifact-hashes.json, redaction-summary.json]
      responses:
        "200":
          description: Report file content.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/JsonError"
  /api/reports/{runId}/artifacts/{artifactId}:
    get:
      summary: Serve a constrained, redacted report artifact.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Redacted artifact content.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/plain:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/JsonError"
        "404":
          $ref: "#/components/responses/JsonError"
  /api/reports/{runId}:
    get:
      summary: Report detail for a run ID or latest.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          $ref: "#/components/responses/JsonObject"
        "404":
          $ref: "#/components/responses/JsonError"
  /api/events/ingest:
    post:
      summary: Ingest a Core event into the active run.
      requestBody:
        $ref: "#/components/requestBodies/JsonObject"
      responses:
        "202":
          $ref: "#/components/responses/JsonObject"
        "400":
          $ref: "#/components/responses/JsonError"
        "405":
          $ref: "#/components/responses/JsonError"
        "413":
          $ref: "#/components/responses/JsonError"
  /api/sidecar/v1/tool-calls:
    post:
      summary: Python sidecar adapter tool-call ingestion endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            examples:
              pythonToolCall:
                $ref: "#/components/examples/SidecarToolCallRequest"
      responses:
        "200":
          description: Accepted sidecar tool-call payload.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              examples:
                accepted:
                  $ref: "#/components/examples/SidecarToolCallSuccess"
        "400":
          $ref: "#/components/responses/JsonError"
        "405":
          $ref: "#/components/responses/JsonError"
        "413":
          $ref: "#/components/responses/JsonError"
        "426":
          description: Sidecar protocol version mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                protocolMismatch:
                  $ref: "#/components/examples/SidecarProtocolMismatch"
components:
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
      description: Concrete run ID or the alias latest where supported.
    RelativePath:
      name: relativePath
      in: path
      required: true
      schema:
        type: string
      description: Slash-delimited bundle-relative path constrained to the active bundle directory.
  requestBodies:
    JsonObject:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
  responses:
    JsonObject:
      description: JSON object response.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    JsonError:
      description: Stable JSON error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
      additionalProperties: true
    IntegrationsPayload:
      type: object
      required: [runId, generatedAt, integrations]
      properties:
        runId:
          type: string
        generatedAt:
          type: string
          format: date-time
        integrations:
          type: array
          items:
            type: object
            additionalProperties: true
        routeCoverage:
          type: array
          items:
            type: object
            additionalProperties: true
        coverageHistory:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    LatestRunPayload:
      type: object
      required: [runId, eventsPath, evidenceDir, eventCount, events]
      properties:
        runId:
          type: string
        eventsPath:
          type: string
        evidenceDir:
          type: string
        eventCount:
          type: number
        events:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    RunIndexPayload:
      type: object
      required: [indexPath, count, records]
      properties:
        indexPath:
          type: string
        count:
          type: number
        records:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    HealthPayload:
      type: object
      required: [runId, generatedAt, summary, rows]
      properties:
        runId:
          type: string
        generatedAt:
          type: string
        summary:
          type: object
          additionalProperties: true
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    FailureInboxPayload:
      type: object
      required: [runId, generatedAt, failures]
      properties:
        runId:
          type: string
        generatedAt:
          type: string
        failures:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    ImpactPayload:
      type: object
      required: [runId, generatedAt, summary, entries]
      properties:
        runId:
          type: string
        generatedAt:
          type: string
        summary:
          type: object
          additionalProperties: true
        entries:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    TriagePayload:
      type: object
      required: [runId, generatedAt, summary]
      properties:
        runId:
          type: string
        generatedAt:
          type: string
        summary:
          type: object
          additionalProperties: true
      additionalProperties: true
    TracePayload:
      type: object
      required: [runId, traceId, generatedAt, status, events, nodes, correlation]
      properties:
        runId:
          type: string
        traceId:
          type: string
        generatedAt:
          type: string
        status:
          type: string
        events:
          type: array
          items:
            type: object
            additionalProperties: true
        nodes:
          type: array
          items:
            type: object
            additionalProperties: true
        correlation:
          type: object
          additionalProperties: true
      additionalProperties: true
    PolicyPayload:
      type: object
      required: [runId, generatedAt, decisions, rules, preview]
      properties:
        runId:
          type: string
        generatedAt:
          type: string
        decisions:
          type: array
          items:
            type: object
            additionalProperties: true
        rules:
          type: array
          items:
            type: object
            additionalProperties: true
        preview:
          type: object
          additionalProperties: true
      additionalProperties: true
    ReplayPayload:
      type: object
      required: [runId, generatedAt, replayCategories, replayableRuns, fixtures, latestReplayEvents]
      properties:
        runId:
          type: string
        generatedAt:
          type: string
        replayCategories:
          type: array
          items:
            type: object
            additionalProperties: true
        replayableRuns:
          type: array
          items:
            type: object
            additionalProperties: true
        fixtures:
          type: array
          items:
            type: object
            additionalProperties: true
        latestReplayEvents:
          type: array
          items:
            type: object
            additionalProperties: true
        freshCorrelation:
          type: object
          additionalProperties: true
      additionalProperties: true
    ReportsPayload:
      type: object
      required: [runId, generatedAt, reports]
      properties:
        runId:
          type: string
        generatedAt:
          type: string
        reports:
          type: array
          items:
            $ref: "#/components/schemas/ReportView"
      additionalProperties: true
    ReportView:
      type: object
      required: [runId, reportUrl, manifestUrl, artifactHashUrl, redactionSummaryUrl, manifestValid, validationErrors]
      properties:
        runId:
          type: string
        generatedAt:
          type: string
        reportHtml:
          type: string
        reportUrl:
          type: string
        manifestJson:
          type: string
        manifestUrl:
          type: string
        artifactHashList:
          type: string
        artifactHashUrl:
          type: string
        redactionSummaryPath:
          type: string
        redactionSummaryUrl:
          type: string
        manifestValid:
          type: boolean
        validationErrors:
          type: array
          items:
            type: string
        redactionSummary:
          type: object
          additionalProperties: true
      additionalProperties: true
    ReportExportResponse:
      type: object
      required:
        [
          runId,
          reportHtml,
          reportUrl,
          manifestJson,
          manifestUrl,
          artifactHashList,
          artifactHashUrl,
          redactionSummary,
          redactionSummaryUrl,
          manifestValid,
          validationErrors
        ]
      properties:
        runId:
          type: string
        reportHtml:
          type: string
        reportUrl:
          type: string
        manifestJson:
          type: string
        manifestUrl:
          type: string
        artifactHashList:
          type: string
        artifactHashUrl:
          type: string
        redactionSummary:
          type: string
        redactionSummaryUrl:
          type: string
        manifestValid:
          type: boolean
        validationErrors:
          type: array
          items:
            type: string
      additionalProperties: true
    BundlePayload:
      type: object
      required: [runId, generatedAt, bundle]
      properties:
        runId:
          type: string
        generatedAt:
          type: string
        bundle:
          type: object
          properties:
            exists:
              type: boolean
            manifestValid:
              type: boolean
            validationErrors:
              type: array
              items:
                type: string
            manifestValidationUrl:
              type: string
            files:
              type: array
              items:
                type: object
                additionalProperties: true
            redactionSummary:
              type: object
              additionalProperties: true
          additionalProperties: true
      additionalProperties: true
    BundleExportResponse:
      type: object
      required:
        [runId, bundleDir, manifestJson, manifestUrl, manifestValidation, manifestValidationUrl, manifestValid, validationErrors, files]
      properties:
        runId:
          type: string
        bundleDir:
          type: string
        manifestJson:
          type: string
        manifestUrl:
          type: string
        manifestValidation:
          type: string
        manifestValidationUrl:
          type: string
        manifestValid:
          type: boolean
        validationErrors:
          type: array
          items:
            type: string
        files:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    ValidationDashboardPayload:
      type: object
      required: [runId, generatedAt, deterministicSeed, approvedPorts, artifactCoverage, checks]
      properties:
        runId:
          type: string
        generatedAt:
          type: string
        deterministicSeed:
          type: string
        approvedPorts:
          type: array
          items:
            type: number
        artifactCoverage:
          type: object
          additionalProperties: true
        checks:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    TopologyPayload:
      type: object
      required: [runId, generatedFrom, summary, nodes, edges]
      properties:
        runId:
          type: string
        generatedFrom:
          type: object
          additionalProperties: true
        summary:
          type: object
          additionalProperties: true
        nodes:
          type: array
          items:
            type: object
            additionalProperties: true
        edges:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    NarrativePayload:
      type: object
      required: [runId, generatedFrom, text, sections]
      properties:
        runId:
          type: string
        generatedFrom:
          type: object
          additionalProperties: true
        text:
          type: string
        sections:
          type: object
          additionalProperties:
            type: string
      additionalProperties: true
    IntegrationVerificationRequest:
      type: object
      required: [routeType]
      properties:
        routeType:
          type: string
          enum:
            - mcp-routed
            - cli-supervised
            - sdk-wrapped-python
            - js-ts-wrapper
            - http-webhook-import
            - browser-evidence-import
        integrationId:
          type: string
        hostId:
          type: string
        hostName:
          type: string
        hostFamily:
          type: string
        supportedHostIds:
          type: array
          items:
            type: string
        platform:
          type: string
        transport:
          type: string
        configHash:
          type: string
      additionalProperties: false
    IntegrationVerificationReceipt:
      type: object
      required:
        - receiptId
        - runId
        - timestamp
        - routeType
