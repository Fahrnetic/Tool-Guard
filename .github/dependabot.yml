version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
    groups:
      tooling:
        patterns:
          - "eslint*"
          - "typescript*"
          - "vitest"
          - "@vitest/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
    open-pull-requests-limit: 5
    labels:
      - "type: chore"
      - "area: infra"
    cooldown:
      default-days: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "type: chore"
      - "area: infra"
    cooldown:
      default-days: 3
