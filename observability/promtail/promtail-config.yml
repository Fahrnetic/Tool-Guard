server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: toolguard-runs
    static_configs:
      - targets: [localhost]
        labels:
          job: toolguard-runs
          service_name: toolguard-local-demo
          __path__: /workspace/runs/**/otel-logs.json
    pipeline_stages:
      - json:
          expressions:
            resourceLogs: resourceLogs
      - labels:
          service_name:
