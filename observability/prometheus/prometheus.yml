global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: toolguard-core
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3660"]
        labels:
          service: toolguard-core
          environment: local
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          service: otel-collector
          environment: local
  - job_name: otel-collector-exported
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: otel-collector-exported
          environment: local
