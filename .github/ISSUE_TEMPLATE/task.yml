name: Task
description: Track maintenance, refactoring, or operational work.
title: "[Task]: "
labels: ["type: chore", "priority: needs-triage"]
body:
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What needs to be done?
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Which commands or evidence prove completion?
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - priority: p0
        - priority: p1
        - priority: p2
        - priority: p3
    validations:
      required: true
