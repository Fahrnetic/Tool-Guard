<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Benchmark and evidence loop</title>
  <desc id="desc">A two-row workflow showing a covered call becoming evidence that improves the next benchmark.</desc>
  <style>
    .bg { fill: #f8fafc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .route { fill: #dbeafe; stroke: #2563eb; stroke-width: 2.5; }
    .observe { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2.5; }
    .classify { fill: #ffedd5; stroke: #ea580c; stroke-width: 2.5; }
    .write { fill: #dcfce7; stroke: #16a34a; stroke-width: 2.5; }
    .replay { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2.5; }
    .coverage { fill: #f1f5f9; stroke: #64748b; stroke-width: 2.5; }
    .arrow { stroke: #334155; stroke-width: 3.5; stroke-linecap: round; fill: none; marker-end: url(#arrowhead); }
    .title,
    .subtitle,
    .label,
    .body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { fill: #0f172a; font-size: 34px; font-weight: 750; }
    .subtitle { fill: #475569; font-size: 20px; font-weight: 500; }
    .label { fill: #1e293b; font-size: 22px; font-weight: 750; }
    .body { fill: #475569; font-size: 20px; font-weight: 500; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M3,3 L11,7 L3,11 Z" fill="#334155" />
    </marker>
  </defs>

  <rect class="bg" width="1000" height="620" />
  <text class="title" x="500" y="64" text-anchor="middle">Benchmark and evidence loop</text>
  <text class="subtitle" x="500" y="100" text-anchor="middle">A covered call becomes evidence, then improves the next benchmark.</text>

  <rect class="panel" x="70" y="135" width="860" height="430" rx="26" />

  <rect class="route" x="95" y="190" width="230" height="110" rx="18" />
  <text class="label" x="210" y="237" text-anchor="middle">Route</text>
  <text class="body" x="210" y="270" text-anchor="middle">covered path</text>

  <rect class="observe" x="385" y="190" width="230" height="110" rx="18" />
  <text class="label" x="500" y="237" text-anchor="middle">Observe</text>
  <text class="body" x="500" y="270" text-anchor="middle">calls and output</text>

  <rect class="classify" x="675" y="190" width="230" height="110" rx="18" />
  <text class="label" x="790" y="237" text-anchor="middle">Classify</text>
  <text class="body" x="790" y="270" text-anchor="middle">loud or silent</text>

  <rect class="write" x="675" y="375" width="230" height="110" rx="18" />
  <text class="label" x="790" y="422" text-anchor="middle">Write</text>
  <text class="body" x="790" y="455" text-anchor="middle">safe bundle</text>

  <rect class="replay" x="385" y="375" width="230" height="110" rx="18" />
  <text class="label" x="500" y="422" text-anchor="middle">Replay</text>
  <text class="body" x="500" y="455" text-anchor="middle">fixture-safe cases</text>

  <rect class="coverage" x="95" y="375" width="230" height="110" rx="18" />
  <text class="label" x="210" y="422" text-anchor="middle">Coverage</text>
  <text class="body" x="210" y="455" text-anchor="middle">name blind spots</text>

  <path class="arrow" d="M346 245 H364" />
  <path class="arrow" d="M636 245 H654" />
  <path class="arrow" d="M790 322 V353" />
  <path class="arrow" d="M654 430 H636" />
  <path class="arrow" d="M364 430 H346" />
  <path class="arrow" d="M210 353 V322" />
</svg>
